<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Workout Tracker</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --accent: #c8f542;
  --accent2: #a8d422;
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --danger: #ff5a5a;
  --success: #4dde8a;
  --warn: #f5a623;
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; overscroll-behavior: none; }
input, select, textarea, button { font-family: var(--sans); }

/* LAYOUT */
.app { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
  padding: calc(var(--safe-top) + 14px) 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.topbar-title { flex: 1; }
.topbar-title h1 { font-size: 17px; font-weight: 600; color: var(--text); }
.topbar-title p { font-size: 12px; color: var(--text2); font-family: var(--mono); margin-top: 1px; }
.week-btns { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.icon-btn:active { background: var(--surface); transform: scale(0.94); }

/* SESSION TABS */
.session-nav {
  display: flex; gap: 6px; padding: 12px 16px;
  overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.session-nav::-webkit-scrollbar { display: none; }
.stab {
  flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.stab.active { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
.stab:active { transform: scale(0.95); }

/* MAIN CONTENT */
.content { flex: 1; padding: 16px 16px calc(var(--safe-bot) + 80px); }

/* EXERCISE CARD */
.ex-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
}
.ex-header {
  padding: 12px 14px 0;
  display: flex; align-items: flex-start; gap: 8px;
}
.ex-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.3; }
.badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px;
  border-radius: 10px; letter-spacing: 0.4px; flex-shrink: 0; margin-top: 2px;
}
.badge-ss { background: rgba(200,245,66,0.12); color: var(--accent); border: 1px solid rgba(200,245,66,0.2); }
.badge-cardio { background: rgba(77,222,138,0.12); color: var(--success); border: 1px solid rgba(77,222,138,0.2); }
.prescribed {
  margin: 8px 14px 0; padding: 8px 10px;
  background: var(--surface2); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text2); line-height: 1.5;
  font-family: var(--mono);
}
.po-hint {
  margin: 8px 14px 0; padding: 8px 10px;
  background: rgba(200,245,66,0.05); border-left: 2px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 11px; color: rgba(200,245,66,0.8); line-height: 1.5;
}

/* SET GRID */
.set-section { padding: 10px 14px 0; }
.set-section-label { font-size: 11px; color: var(--text3); font-weight: 500; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.last-sets { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.last-set { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: var(--radius-sm); padding: 7px 10px; }
.last-set-label { font-size: 11px; color: var(--text3); width: 36px; flex-shrink: 0; }
.last-set-val { font-size: 13px; font-weight: 600; color: var(--text2); font-family: var(--mono); }
.curr-sets { display: flex; flex-direction: column; gap: 8px; }
.set-col { display: flex; align-items: center; gap: 10px; }
.set-col-label { font-size: 11px; color: var(--text3); font-weight: 500; width: 36px; flex-shrink: 0; }
.set-inputs { display: flex; gap: 8px; flex: 1; }
.set-inputs input { flex: 1; min-width: 0; padding: 10px 8px; text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; font-family: var(--mono); font-weight: 500; transition: border-color 0.15s; }
.set-inputs input:focus { outline: none; border-color: var(--accent); }
.input-sub { display: flex; gap: 8px; padding-left: 46px; }
.input-sub span { flex: 1; text-align: center; font-size: 10px; color: var(--text3); }
.set-col { display: flex; flex-direction: column; gap: 4px; }
.set-col-label { font-size: 11px; color: var(--text3); text-align: center; font-weight: 500; }
.set-inputs { display: flex; gap: 4px; }
.set-inputs input {
  flex: 1; min-width: 0; padding: 9px 4px; text-align: center;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
  font-family: var(--mono); font-weight: 500;
  transition: border-color 0.15s;
}
.set-inputs input:focus { outline: none; border-color: var(--accent); }
.set-inputs input::placeholder { color: var(--text3); font-size: 12px; }
.input-sub { display: flex; gap: 4px; }
.input-sub span { flex: 1; text-align: center; font-size: 10px; color: var(--text3); }

/* NOTES */
.notes-section { padding: 10px 14px 14px; }
textarea {
  width: 100%; padding: 9px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text2); font-size: 13px;
  resize: none; min-height: 50px; line-height: 1.5;
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: var(--border2); }
textarea::placeholder { color: var(--text3); }

/* CARDIO */
.cardio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 14px; }
.cf { display: flex; flex-direction: column; gap: 5px; }
.cf label { font-size: 11px; color: var(--text3); font-weight: 500; letter-spacing: 0.4px; text-transform: uppercase; }
.cf input, .cf select {
  padding: 9px 10px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
  font-family: var(--mono); transition: border-color 0.15s;
}
.cf input:focus, .cf select:focus { outline: none; border-color: var(--accent); }
.cf select option { background: var(--surface2); }

/* BOTTOM BAR */
.bottombar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  padding: 10px 16px calc(var(--safe-bot) + 10px);
  background: rgba(10,10,10,0.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.btn-primary {
  flex: 1; padding: 14px; border-radius: var(--radius);
  background: var(--accent); border: none; color: #0a0a0a;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; letter-spacing: 0.2px;
}
.btn-primary:active { background: var(--accent2); transform: scale(0.97); }
.btn-secondary {
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text2);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.btn-secondary:active { background: var(--surface); transform: scale(0.97); }

/* TOAST */
.toast {
  position: fixed; top: calc(var(--safe-top) + 70px); left: 50%; transform: translateX(-50%) translateY(-8px);
  background: var(--success); color: #0a0a0a; padding: 10px 20px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* DATA MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  border: 1px solid var(--border2); border-bottom: none;
  padding: 20px 20px calc(var(--safe-bot) + 20px); width: 100%;
  transform: translateY(20px); transition: transform 0.25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
.modal-btns { display: flex; flex-direction: column; gap: 8px; }
.modal-btn {
  width: 100%; padding: 14px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer;
  text-align: left; transition: all 0.15s;
}
.modal-btn:active { background: var(--bg); }
.modal-btn .btn-icon { font-size: 18px; margin-right: 10px; }
.modal-close {
  width: 100%; padding: 12px; margin-top: 4px; border-radius: var(--radius);
  border: none; background: transparent; color: var(--text2);
  font-size: 14px; cursor: pointer;
}

/* INSTALL BANNER */
.install-banner {
  margin: 0 0 12px; padding: 12px 14px;
  background: rgba(200,245,66,0.07); border: 1px solid rgba(200,245,66,0.2);
  border-radius: var(--radius); display: none; align-items: center; gap: 10px;
}
.install-banner.show { display: flex; }
.install-banner p { flex: 1; font-size: 13px; color: rgba(200,245,66,0.9); line-height: 1.4; }
.install-btn {
  padding: 7px 13px; border-radius: var(--radius-sm);
  background: var(--accent); border: none; color: #0a0a0a;
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}

/* WEEK CHIP */
.week-chip {
  display: inline-block; padding: 3px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; font-size: 12px; color: var(--text2);
  font-family: var(--mono); margin-bottom: 14px;
}
.week-chip.current { border-color: rgba(200,245,66,0.3); color: var(--accent); background: rgba(200,245,66,0.05); }

/* SECTION DIVIDER */
.section-title {
  font-size: 11px; font-weight: 600; color: var(--text3);
  letter-spacing: 1px; text-transform: uppercase;
  margin: 16px 0 10px; padding-left: 2px;
}

/* HIDDEN file input */
#csv-import { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Tharindi <span style="color:var(--accent)">Workouts</span></h1>
      <p id="week-label">Loading...</p>
    </div>
    <div class="week-btns">
      <button class="icon-btn" onclick="changeWeek(-1)" aria-label="Previous week">&#8592;</button>
      <button class="icon-btn" onclick="changeWeek(1)" aria-label="Next week">&#8594;</button>
      <button class="icon-btn" onclick="openModal()" aria-label="Data options" style="font-size:18px">&#8942;</button>
    </div>
  </div>

  <div class="session-nav" id="session-nav"></div>

  <div class="content" id="content">
    <div class="install-banner" id="install-banner">
      <p>Install this app on your home screen for offline access</p>
      <button class="install-btn" id="install-btn">Install</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>Data &amp; backup</h2>
    <div class="modal-btns">
      <button class="modal-btn" onclick="exportCSV()">
        <span class="btn-icon">&#8593;</span>Export all data as CSV
      </button>
      <button class="modal-btn" onclick="document.getElementById('csv-import').click()">
        <span class="btn-icon">&#8595;</span>Import CSV backup
      </button>
      <button class="modal-btn" onclick="exportJSON()">
        <span class="btn-icon">&#128190;</span>Export full backup (JSON)
      </button>
      <button class="modal-btn" onclick="document.getElementById('json-import').click()">
        <span class="btn-icon">&#128257;</span>Restore from JSON backup
      </button>
    </div>
    <button class="modal-close" onclick="closeModal()">Cancel</button>
  </div>
</div>

<input type="file" id="csv-import" accept=".csv" onchange="importCSV(event)">
<input type="file" id="json-import" accept=".json" style="display:none" onchange="importJSON(event)">

<div class="bottombar">
  <button class="btn-secondary" onclick="clearSession()">Clear</button>
  <button class="btn-primary" onclick="saveSession()">Save session &#10003;</button>
</div>

<script>
const SESSIONS = [
  {

    ],
    legacy:[
      {id:'bench_dips',name:'Bench dips'},
    ]
  },
  {
    id:'s5', label:'S5', title:'Lower body — day 2',
    exercises:[
      {id:'hip_thrust',name:'Hip thrust machine',prescribed:'S1/2/3: 10 reps at 25kg',superset:false,
       seed:[{w:25,r:10},{w:25,r:10},{w:25,r:10}],po:'25kg×10 on all 3. Try 27.5kg'},
      {id:'bulgarian',name:'Bulgarian split squat',prescribed:'S1/2/3: 10 reps each leg at 10kg',superset:false,
       seed:[{w:10,r:10},{w:10,r:10},{w:10,r:10}],po:'10kg×10 on all 3. Push for 12 before going heavier'},
      {id:'kb_rdl',name:'KB / DB Romanian deadlift',prescribed:'S1/2/3: 10 reps. Start at 14-16kg',superset:false,
       seed:[],po:'New, RDL on its own (you were at 12kg×10 on the RDL to squat combo). Add 2kg when all 3 sets hit 10. If grip gives out first, use lifting straps'},
      {id:'leg_ext',name:'Leg extension machine',prescribed:'S1/2/3: 10-12 reps at 38.3kg',superset:false,
       seed:[{w:38.3,r:10},{w:38.3,r:10},{w:38.3,r:10}],po:'38.3kg×10 on all 3. Aim for 12 before going up'},
      {id:'leg_raise_chair_s5',name:'Leg raises on chair',prescribed:'S1/2/3: 10-12 reps',superset:false,
       seed:[{w:0,r:10},{w:0,r:10},{w:0,r:10}],po:'Aim for 12 reps, then 15 before adding ankle weights'},
      {id:'hip_abductor_s5',name:'Hip abductor',prescribed:'S1/2/3: 10-12 reps at 31.3kg',superset:false,
       seed:[{w:31.3,r:10},{w:31.3,r:10},{w:31.3,r:10}],po:'Push to 12 reps, then go up a plate'},
      {id:'hip_adductor_s5',name:'Hip adductor',prescribed:'S1/2/3: 10-12 reps at 25.3kg',superset:false,
       seed:[{w:25.3,r:10},{w:25.3,r:10},{w:25.3,r:10}],po:'25.3kg×10 on all 3. Push to 12, then go up'},
      {id:'back_ext',name:'Back extension (45° bench, glute focus)',prescribed:'S1/2/3: 12 reps. Bodyweight first, then hold a plate',superset:false,
       seed:[],po:'New, replaces wall sit. Pad just below your hip bones, upper back slightly rounded, squeeze your glutes to come up and stop when your body is straight (don\'t lean back past it). Log 0kg for bodyweight. When all 3 sets hit 15, hold a 5kg plate to your chest'},
    ],
    legacy:[
      {id:'rdl_squat',name:'KB RDL to squat'},
      {id:'wall_sit',name:'Wall sit'},
    ]
  }
];

const setCount = ex => ex.sets || 3;
const DEFAULT_FIELDS = [{k:'w',label:'kg',step:'0.5'},{k:'r',label:'reps',step:'1'}];
const fieldsOf = ex => ex.fields || DEFAULT_FIELDS;

const HANG = {id:'dead_hang',name:'Dead hang (optional)',prescribed:'Hang from the pull-up bar as long as you can. Goal: 60 sec',superset:false,
  fields:[{k:'s',label:'sec',step:'1'}],seed:[],po:''};
const HANG_BASELINE = 24;
const exercisesOf = sess => sess.exercises.concat([HANG]);
const legacyOf = sess => sess.legacy || [];
const findSession = title => SESSIONS.find(s => s.title === title || (s.aliases || []).includes(title));

// Most recent earlier week that has data for this exercise, so a skipped week never hides your numbers
function lastLogged(sessionId, ex) {
  const fields = fieldsOf(ex);
  const cur = getWeekKey(currentWeek);
  const keys = Object.keys(allData).filter(k => k < cur).sort().reverse();
  for (const k of keys) {
    const sids = ex.id === HANG.id ? SESSIONS.map(s => s.id) : [sessionId];
    for (const sid of sids) {
      const ed = ((allData[k] || {})[sid] || {})[ex.id];
      if (ed && (ed.sets || []).some(x => x && fields.some(f => x[f.k]))) return { week: k, sets: ed.sets };
    }
  }
  return null;
}

// One-time copy: hangs you logged under "Wall sit" become dead hang entries (wall sit record is kept)
function migrateHangs() {
  let changed = false;
  Object.values(allData).forEach(wk => {
    const s5 = wk && wk.s5;
    const ws = s5 && s5.wall_sit;
    if (ws && /hang/i.test(ws.note || '') && !s5.dead_hang) {
      s5.dead_hang = { sets: (ws.sets || []).map(x => ({ s: x.r || '' })), note: 'Copied from wall sit log' };
      changed = true;
    }
  });
  if (changed) saveData();
}

function bestHang() {
  let best = HANG_BASELINE;
  Object.values(allData).forEach(wk => Object.values(wk || {}).forEach(sd => {
    const h = sd && sd.dead_hang;
    (h && h.sets || []).forEach(x => { const n = parseFloat(x.s); if (n > best) best = n; });
  }));
  return best;
}

let currentWeek = 0;
let activeSession = 's1';
let allData = {};
let deferredPrompt = null;

function getWeekStart(offset) {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff + offset * 7);
  mon.setHours(0,0,0,0);
  return mon;
}

function getWeekKey(offset) {
  return getWeekStart(offset).toISOString().split('T')[0];
}

function getWeekLabel(offset) {
  const start = getWeekStart(offset);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString('en-AU', {day:'numeric',month:'short'});
  const label = fmt(start) + ' – ' + fmt(end);
  if (offset === 0) return 'This week — ' + label;
  if (offset === -1) return 'Last week — ' + label;
  if (offset === 1) return 'Next week — ' + label;
  return label;
}

function loadData() {
  try { const s = localStorage.getItem('wt2_data'); if (s) allData = JSON.parse(s); } catch(e) {}
}

function saveData() {
  try { localStorage.setItem('wt2_data', JSON.stringify(allData)); } catch(e) {}
}

function getSD(weekOffset, sessionId) {
  return (allData[getWeekKey(weekOffset)] || {})[sessionId] || {};
}

function setSD(weekOffset, sessionId, data) {
  const wk = getWeekKey(weekOffset);
  if (!allData[wk]) allData[wk] = {};
  allData[wk][sessionId] = data;
  saveData();
}

function changeWeek(dir) {
  currentWeek += dir;
  document.getElementById('week-label').textContent = getWeekLabel(currentWeek);
  renderSession();
}

function renderTabs() {
  document.getElementById('session-nav').innerHTML = SESSIONS.map(s =>
    `<button class="stab${s.id===activeSession?' active':''}" onclick="setSession('${s.id}')">${s.label}<br><span style="font-size:10px;font-weight:400;opacity:0.75">${s.title.split('—')[0].trim()}</span></button>`
  ).join('');
}

function setSession(id) { activeSession = id; renderTabs(); renderSession(); }

function v(id) { return document.getElementById(id); }
function val(id) { const el = v(id); return el ? el.value : ''; }

function renderSession() {
  const sess = SESSIONS.find(s => s.id === activeSession);
  const currData = getSD(currentWeek, activeSession);
  const isCurrentWeek = currentWeek === 0;
  let html = '';

  html += `<div class="week-chip${isCurrentWeek?' current':''}">${getWeekLabel(currentWeek)}</div>`;

  exercisesOf(sess).forEach((ex, idx, list) => {
    const fields = fieldsOf(ex);
    const cd = currData[ex.id] || {};
    const sets = cd.sets || [];
    const last = lastLogged(activeSession, ex);
    const psets = last ? last.sets : [];
    const hasSeed = ex.seed && ex.seed.length > 0;
    const filled = x => x && fields.some(f => x[f.k]);
    const hasPrev = !!last;

    if (ex.id === HANG.id) html += `<div class="section-title">Pull-up progress</div>`;
    else if (idx === 0 || list[idx-1].superset !== ex.superset)
      html += `<div class="section-title">${ex.superset ? 'Superset' : 'Exercises'}</div>`;

    html += `<div class="ex-card">
      <div class="ex-header">
        <span class="ex-name">${ex.name}</span>
        ${ex.superset?'<span class="badge badge-ss">Superset</span>':''}
      </div>
      <div class="prescribed">${ex.prescribed}</div>`;

    html += `<div class="set-section">
      <div class="set-section-label">Last session${last ? ' · week of ' + last.week : ''}</div>
      <div class="last-sets">`;
    for (let i = 0; i < setCount(ex); i++) {
      let vals = fields.map(() => '—');
      if (hasPrev && filled(psets[i])) vals = fields.map(f => psets[i][f.k] || '—');
      else if (hasSeed && ex.seed[i]) vals = fields.map(f => ex.seed[i][f.k] ?? '—');
      const txt = fields.length === 1 ? vals[0] + ' ' + fields[0].label
        : (fields === DEFAULT_FIELDS ? vals.join('×') : vals.map((x,j) => x + ' ' + fields[j].label).join(' · '));
      html += `<div class="last-set"><div class="last-set-label">Set ${i+1}</div><div class="last-set-val">${txt}</div></div>`;
    }
    html += `</div></div>`;

    html += `<div class="set-section">
      <div class="set-section-label">This session</div>
      <div class="curr-sets">`;
    for (let i = 0; i < setCount(ex); i++) {
      html += `<div class="set-col">
        <div class="set-col-label">${setCount(ex) > 1 ? 'Set ' + (i+1) : ''}</div>
        <div class="set-inputs">`;
      fields.forEach(f => {
        const fv = sets[i] && sets[i][f.k] ? sets[i][f.k] : '';
        html += `<input type="number" id="${ex.id}_s${i}_${f.k}" value="${fv}" placeholder="${f.label}" step="${f.step||'1'}" inputmode="decimal">`;
      });
      html += `</div>
        <div class="input-sub">${fields.map(f => `<span>${f.label}</span>`).join('')}</div>
      </div>`;
    }
    html += `</div></div>`;

    if (ex.id === HANG.id) {
      const best = bestHang();
      html += `<div class="po-hint" style="margin:8px 14px">Best so far: ${best} sec · Goal: 60 sec (${Math.min(100, Math.round(best/60*100))}%)</div>`;
    } else if (ex.po) html += `<div class="po-hint" style="margin:8px 14px">${ex.po}</div>`;
    html += `<div class="notes-section"><textarea id="${ex.id}_note" placeholder="Notes for next session...">${cd.note||''}</textarea></div>
    </div>`;
  });

  const legacyHere = legacyOf(sess).filter(ex => currData[ex.id]);
  if (legacyHere.length) {
    html += `<div class="section-title">Old exercises (history)</div>`;
    legacyHere.forEach(ex => {
      const d = currData[ex.id];
      let body = '';
      if (ex.kind === 'treadmill') body = `${d.type||''} ${d.duration?d.duration+' min':''} · speed ${d.speed||'—'} · ${d.distance||'—'} km`;
      else if (ex.kind === 'abs') body = `${d.rounds||'—'} rounds · plank ${d.plank||'?'} sec`;
      else body = (d.sets || []).filter(x => x && (x.w || x.r)).map((x,i) => `Set ${i+1}: ${x.w||0}×${x.r||'—'}`).join('<br>');
      html += `<div class="ex-card"><div class="ex-header"><span class="ex-name">${ex.name}</span></div>
        <div class="prescribed">${body || '—'}${d.note ? '<br>' + d.note : ''}</div><div style="height:12px"></div></div>`;
    });
  }

  document.getElementById('content').innerHTML =
    document.getElementById('install-banner').outerHTML + html;

  // restore install banner state
  checkInstallBanner();
}

function saveSession() {
  const sess = SESSIONS.find(s => s.id === activeSession);
  const data = Object.assign({}, getSD(currentWeek, activeSession));
  exercisesOf(sess).forEach(ex => {
    const sets = [];
    for (let i = 0; i < setCount(ex); i++) {
      const o = {};
      fieldsOf(ex).forEach(f => { o[f.k] = val(ex.id+'_s'+i+'_'+f.k); });
      sets.push(o);
    }
    data[ex.id] = { sets, note: val(ex.id+'_note') };
  });
  setSD(currentWeek, activeSession, data);
  showToast('Session saved ✓');
}

function clearSession() {
  if (!confirm('Clear all entries for this session?')) return;
  const sess = SESSIONS.find(s => s.id === activeSession);
  const kept = {};
  const cd = getSD(currentWeek, activeSession);
  legacyOf(sess).forEach(ex => { if (cd[ex.id]) kept[ex.id] = cd[ex.id]; });
  setSD(currentWeek, activeSession, kept);
  renderSession();
  showToast('Cleared');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---- EXPORT / IMPORT ---- */
function exportCSV() {
  closeModal();
  const rows = [['Week','Session','Exercise','Set','Weight (kg)','Reps','Other','Notes']];
  Object.keys(allData).sort().forEach(wk => {
    const sessData = allData[wk];
    Object.keys(sessData).forEach(sessId => {
      const sess = SESSIONS.find(s => s.id === sessId);
      if (!sess) return;
      const sd = sessData[sessId];
      legacyOf(sess).forEach(ex => {
        const d = sd[ex.id];
        if (!d) return;
        if (ex.kind === 'treadmill') rows.push([wk, sess.title, ex.name, '1', d.speed||'', d.distance||'', '', `${d.type||''} ${d.duration||''}min ${d.note||''}`]);
        else if (ex.kind === 'abs') rows.push([wk, sess.title, ex.name, '1', '', (d.rounds||'')+' rounds', '', `plank ${d.plank||'?'}s`]);
      });
      exercisesOf(sess).concat(legacyOf(sess).filter(x => !x.kind)).forEach(ex => {
        const ed = sd[ex.id] || {};
        (ed.sets || []).forEach((st, i) => {
          if (!Object.values(st).some(x => x)) return;
          const other = Object.keys(st).filter(k => k !== 'w' && k !== 'r' && st[k]).map(k => k+'='+st[k]).join(';');
          rows.push([wk, sess.title, ex.name, i+1, st.w||'', st.r||'', other, i===0?ed.note||'':'']);
        });
      });
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('workout-data-'+new Date().toISOString().split('T')[0]+'.csv', csv, 'text/csv');
  showToast('CSV exported');
}

function exportJSON() {
  closeModal();
  download('workout-backup-'+new Date().toISOString().split('T')[0]+'.json', JSON.stringify(allData, null, 2), 'application/json');
  showToast('JSON backup exported');
}

function importCSV(e) {
  closeModal();
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    const all = evt.target.result.split('\n');
    const hasOther = all[0].includes('Other');
    const lines = all.slice(1);
    let imported = 0;
    lines.forEach(line => {
      if (!line.trim()) return;
      const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
      const clean = cols.map(c => c.replace(/^"|"$/g,'').replace(/""/g,'"'));
      const [wk, sessTitle, exName, setNum, weight, reps] = clean;
      const other = hasOther ? clean[6] : '';
      const notes = hasOther ? clean[7] : clean[6];
      if (!wk || !sessTitle) return;
      const sess = findSession(sessTitle);
      if (!sess) return;
      if (!allData[wk]) allData[wk] = {};
      if (!allData[wk][sess.id]) allData[wk][sess.id] = {};
      const sd = allData[wk][sess.id];
      const ex = exercisesOf(sess).concat(legacyOf(sess)).find(x => x.name === exName);
      if (!ex) return;
      if (ex.kind === 'treadmill') {
        const m = (notes || '').match(/^(W1 sprints|W2 jog)?\s*(\d+)?\s*min\s*(.*)$/);
        sd[ex.id] = { type: m && m[1] || '', duration: m && m[2] || '', speed: weight, distance: reps, note: m ? m[3].trim() : (notes || '') };
        imported++; return;
      }
      if (ex.kind === 'abs') {
        const pm = (notes || '').match(/plank (\S+?)s/);
        sd[ex.id] = { rounds: (reps || '').replace(' rounds', ''), plank: pm && pm[1] !== '?' ? pm[1] : '' };
        imported++; return;
      }
      if (!sd[ex.id]) sd[ex.id] = { sets: [], note: '' };
      const si = parseInt(setNum) - 1;
      if (si >= 0 && si < setCount(ex)) {
        const st = {};
        if (weight) st.w = weight;
        if (reps) st.r = reps;
        (other || '').split(';').forEach(kv => { const [k, x] = kv.split('='); if (k && x) st[k] = x; });
        sd[ex.id].sets[si] = st;
        if (si === 0 && notes) sd[ex.id].note = notes;
      }
      imported++;
    });
    saveData();
    migrateHangs();
    renderSession();
    showToast(`Imported ${imported} rows`);
    e.target.value = '';
  };
  reader.readAsText(file);
}

function importJSON(e) {
  closeModal();
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const parsed = JSON.parse(evt.target.result);
      allData = parsed;
      saveData();
      renderSession();
      showToast('Backup restored');
    } catch(err) { showToast('Invalid JSON file'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function download(filename, content, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---- MODAL ---- */
function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

/* ---- PWA INSTALL ---- */
function checkInstallBanner() {
  const banner = document.getElementById('install-banner');
  if (!banner) return;
  if (deferredPrompt) banner.classList.add('show');
  else banner.classList.remove('show');
  const btn = document.getElementById('install-btn');
  if (btn) btn.onclick = () => {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; banner.classList.remove('show'); });
  };
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; checkInstallBanner();
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; checkInstallBanner(); });

/* ---- INIT ---- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
loadData();
migrateHangs();
document.getElementById('week-label').textContent = getWeekLabel(0);
renderTabs();
renderSession();
</script>
